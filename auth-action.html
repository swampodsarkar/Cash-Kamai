<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Processing - Cash Kamai</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <style>
    .auth-action { display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px; }
    .action-box { max-width:460px;width:100%;padding:48px 36px;background:var(--bg-card);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.5);text-align:center; }
    .action-box h2 { font-size:24px;font-weight:700;margin-bottom:12px; }
    .action-box p { color:var(--text-muted);margin-bottom:24px; }
    .action-icon { margin-bottom:16px; }
    .action-box .btn { margin-top:16px; }
  </style>
</head>
<body>
  <div class="auth-action">
    <div class="action-box" id="actionBox">
      <div class="action-icon" id="actionIcon">
        <svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="var(--primary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </div>
      <h2 id="actionTitle">Processing...</h2>
      <p id="actionMessage">Please wait while we process your request.</p>
      <div id="actionButton"></div>
    </div>
  </div>

  <script>
    (async function() {
      const params = new URLSearchParams(window.location.search);
      const mode = params.get('mode');
      const oobCode = params.get('oobCode');
      const continueUrl = params.get('continueUrl') || 'https://cash-kamai.vercel.app/login.html';

      const icon = document.getElementById('actionIcon');
      const title = document.getElementById('actionTitle');
      const msg = document.getElementById('actionMessage');
      const btn = document.getElementById('actionButton');

      if (!mode || !oobCode) {
        icon.innerHTML = '<svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="#ff5252" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>';
        title.textContent = 'Invalid Link';
        msg.textContent = 'This verification link is invalid or has expired.';
        btn.innerHTML = '<a href="login.html" class="btn btn-primary">Go to Login</a>';
        return;
      }

      try {
        if (mode === 'verifyEmail') {
          await firebase.auth().applyActionCode(oobCode);
          icon.innerHTML = '<svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="#69f0ae" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
          title.textContent = 'Email Verified!';
          msg.textContent = 'Your email has been successfully verified. You can now login to your account.';
          btn.innerHTML = '<a href="login.html" class="btn btn-primary">Login Now</a>';
        } else if (mode === 'resetPassword') {
          icon.innerHTML = '<svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="var(--primary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
          title.textContent = 'Reset Password';
          msg.innerHTML = 'Enter your new password below:';
          btn.innerHTML = '<div class="form-group"><input type="password" id="newPass" placeholder="New password (min 6 characters)" style="width:100%;padding:14px 16px;background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:10px;color:#fff;font-size:15px;outline:none;"></div><button onclick="resetPass(\'' + oobCode + '\')" class="btn btn-primary btn-full">Set New Password</button>';
        } else if (mode === 'recoverEmail') {
          await firebase.auth().applyActionCode(oobCode);
          icon.innerHTML = '<svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="#69f0ae" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
          title.textContent = 'Email Recovered!';
          msg.textContent = 'Your email has been recovered successfully.';
          btn.innerHTML = '<a href="login.html" class="btn btn-primary">Go to Login</a>';
        } else {
          throw new Error('Unknown action mode: ' + mode);
        }
      } catch (err) {
        icon.innerHTML = '<svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="#ff5252" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>';
        title.textContent = 'Error';
        if (err.code === 'auth/expired-action-code') msg.textContent = 'This link has expired. Please request a new one.';
        else if (err.code === 'auth/invalid-action-code') msg.textContent = 'This link is invalid. Please request a new one.';
        else msg.textContent = err.message;
        btn.innerHTML = '<a href="login.html" class="btn btn-primary">Go to Login</a>';
      }
    })();

    window.resetPass = async function(oobCode) {
      const newPass = document.getElementById('newPass').value;
      if (newPass.length < 6) { alert('Password must be at least 6 characters'); return; }
      try {
        await firebase.auth().confirmPasswordReset(oobCode, newPass);
        document.getElementById('actionIcon').innerHTML = '<svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="#69f0ae" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
        document.getElementById('actionTitle').textContent = 'Password Reset!';
        document.getElementById('actionMessage').textContent = 'Your password has been reset successfully. You can now login with your new password.';
        document.getElementById('actionButton').innerHTML = '<a href="login.html" class="btn btn-primary">Login Now</a>';
      } catch (err) { alert('Error: ' + err.message); }
    };
  </script>
</body>
</html>
