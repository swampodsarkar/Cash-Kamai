<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <meta property="og:title" content="Login / Register - Cash Kamai">
  <meta property="og:description" content="Sign in or create a free account on Cash Kamai. Start earning money by watching ads daily.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://cashkamai.netlify.app/login.html">
  <meta property="og:image" content="https://cashkamai.netlify.app/apple-touch-icon.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Login / Register - Cash Kamai">
  <meta name="twitter:description" content="Sign in or create a free account on Cash Kamai. Start earning money by watching ads daily.">
  <meta name="description" content="Sign in or create a free account on Cash Kamai. Start earning money by watching ads daily.">
  <link rel="canonical" href="https://cashkamai.netlify.app/login.html">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Register - Cash Kamai</title>
  <link rel="stylesheet" href="css/style.css">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-E2DPEL6DP5"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-E2DPEL6DP5');</script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
</head>
<body>
  <div class="auth-container">
    <div class="auth-box">
      <div class="auth-logo"><svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="var(--primary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v12M8 12h8"/><circle cx="12" cy="12" r="6" fill="var(--primary)" opacity="0.15"/></svg></div>

      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin" onclick="switchAuthTab('login')">Login</button>
        <button class="auth-tab" id="tabRegister" onclick="switchAuthTab('register')">Register</button>
      </div>

      <div class="auth-header">
        <h1 id="authTitle">Login</h1>
        <p id="authSubtitle">Sign in to your account</p>
      </div>

      <div id="errorMsg" class="msg msg-error"></div>
      <div id="successMsg" class="msg msg-success"></div>

      <form id="authForm">
        <div id="nameField" class="form-group" style="display:none;">
          <label>Full Name</label>
          <input type="text" id="fullName" placeholder="John Doe">
        </div>
        <div id="mobileField" class="form-group" style="display:none;">
          <label>Mobile Number</label>
          <input type="tel" id="mobile" placeholder="017XXXXXXXX">
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Min 6 characters" required>
        </div>
        <div id="refField" class="form-group" style="display:none;">
          <label>Referral Email (optional)</label>
          <input type="text" id="referral" placeholder="Referrer's email">
        </div>

        <button type="submit" id="authBtn" class="btn btn-primary btn-large btn-full">Login</button>
      </form>

      <p class="auth-switch">
        <span class="switch-text">Don't have an account?</span>
        <a href="#" onclick="switchAuthTab('register');return false;">Register here</a>
      </p>
      <a href="index.html" class="back-link">Back to Home</a>
    </div>
  </div>

  <script src="js/anti-devtools.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
