  <div class="auth-container">
    <div class="auth-box">

      <div class="auth-header">
        <h1>Admin Login</h1>
        <p>Access your admin control panel</p>

      <div id="errorMsg" class="msg msg-error"></div>

          <label>Admin Email</label>
          <input type="email" id="adminEmail" placeholder="mdswampodsarkar@gmail.com" required>

        <div class="form-group">
          <label>Admin Password</label>
          <input type="password" id="adminPassword" placeholder="Enter admin password" required>

        <button type="submit" id="adminAuthBtn" class="btn btn-primary btn-large btn-full">
          🔐 Admin Login
        </button>
      </form>
