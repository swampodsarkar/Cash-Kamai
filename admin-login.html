<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Cash Kamai</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
</head>
<body>
  <div class="auth-container">
    <div class="auth-box">
      <div class="auth-logo">🔐</div>
      <div class="auth-header">
        <h1>Admin Login</h1>
        <p>Access your admin control panel</p>
      </div>

      <div id="errorMsg" class="msg msg-error"></div>
      <div id="successMsg" class="msg msg-success"></div>

      <form id="adminAuthForm">
        <div class="form-group">
          <label>Admin Email</label>
          <input type="email" id="adminEmail" placeholder="mdswampodsarkar@gmail.com" required>
        </div>
        <div class="form-group">
          <label>Admin Password</label>
          <input type="password" id="adminPassword" placeholder="Enter admin password" required>
        </div>

        <button type="submit" id="adminAuthBtn" class="btn btn-primary btn-large btn-full">
          🔐 Admin Login
        </button>
      </form>

      <p class="auth-switch">
        <span>Back to main site?</span>
        <a href="../index.html">Go to Home</a>
      </p>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
